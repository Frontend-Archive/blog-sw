name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 빌드 전 sync 가 archive 레포를 읽는다. 인증 없이 부르면 시간당 60회라
      # 러너 IP 를 나눠 쓰는 사이 소진되기 쉽다. 워크플로에 자동으로 주어지는
      # 토큰을 넘겨 1,000회로 올린다. archive 가 public 이라 이걸로 충분하다.
      - name: Build
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
